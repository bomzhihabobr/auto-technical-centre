<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест ChatGPT-бота</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(255,255,255,0.1);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        .test-section {
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
        }
        .test-input {
            width: 100%;
            padding: 10px;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 5px;
            background: rgba(255,255,255,0.1);
            color: white;
            margin-bottom: 10px;
        }
        .test-button {
            background: #ff7a00;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 10px;
        }
        .test-button:hover {
            background: #ff9500;
        }
        .response {
            margin-top: 15px;
            padding: 10px;
            background: rgba(0,0,0,0.3);
            border-radius: 5px;
        }
        .status {
            padding: 5px 10px;
            border-radius: 3px;
            font-size: 0.9em;
        }
        .online { background: #27ae60; }
        .offline { background: #e74c3c; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Тест ChatGPT-бота</h1>

        <div class="test-section">
            <h3>Статус сервера: <span id="status" class="status offline">Проверка...</span></h3>
        </div>

        <div class="test-section">
            <h3>Обучение бота</h3>
            <input type="text" class="test-input" id="learnInput" placeholder='обучить: что такое диагностическая карта -> Диагностическая карта выдается после прохождения техосмотра и подтверждает техническую исправность автомобиля.'>
            <button class="test-button" onclick="sendLearnCommand()">Обучить</button>
        </div>

        <div class="test-section">
            <h3>Тест вопроса</h3>
            <input type="text" class="test-input" id="questionInput" placeholder="что такое диагностическая карта">
            <button class="test-button" onclick="sendQuestion()">Спросить</button>
        </div>

        <div id="response" class="response" style="display: none;">
            <h4>Ответ бота:</h4>
            <div id="botResponse"></div>
            <div style="margin-top: 10px; font-size: 0.9em; opacity: 0.8;">
                Намерение: <span id="intent"></span> |
                Уверенность: <span id="confidence"></span> |
                Контекстный: <span id="contextual"></span>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let userId = 'test_user_' + Date.now();

        function checkServerStatus() {
            fetch('http://localhost:3003/')
                .then(() => {
                    document.getElementById('status').textContent = 'Онлайн';
                    document.getElementById('status').className = 'status online';
                    connectWebSocket();
                })
                .catch(() => {
                    document.getElementById('status').textContent = 'Оффлайн';
                    document.getElementById('status').className = 'status offline';
                });
        }

        function connectWebSocket() {
            ws = new WebSocket('ws://localhost:3003');

            ws.onopen = function() {
                console.log('WebSocket connected');
            };

            ws.onmessage = function(event) {
                const data = JSON.parse(event.data);
                if (data.type === 'chat_response') {
                    showResponse(data);
                }
            };

            ws.onerror = function(error) {
                console.error('WebSocket error:', error);
            };
        }

        function sendLearnCommand() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                alert('WebSocket не подключен!');
                return;
            }

            const learnText = document.getElementById('learnInput').value;
            if (!learnText) {
                alert('Введите команду обучения!');
                return;
            }

            ws.send(JSON.stringify({
                type: 'chat',
                message: learnText,
                userId: userId
            }));

            document.getElementById('learnInput').value = '';
        }

        function sendQuestion() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                alert('WebSocket не подключен!');
                return;
            }

            const questionText = document.getElementById('questionInput').value;
            if (!questionText) {
                alert('Введите вопрос!');
                return;
            }

            ws.send(JSON.stringify({
                type: 'chat',
                message: questionText,
                userId: userId
            }));

            document.getElementById('questionInput').value = '';
        }

        function showResponse(data) {
            const responseDiv = document.getElementById('response');
            const botResponseDiv = document.getElementById('botResponse');
            const intentDiv = document.getElementById('intent');
            const confidenceDiv = document.getElementById('confidence');
            const contextualDiv = document.getElementById('contextual');

            botResponseDiv.textContent = data.message;
            intentDiv.textContent = data.intent;
            confidenceDiv.textContent = (data.confidence * 100).toFixed(1) + '%';
            contextualDiv.textContent = data.contextual ? 'Да' : 'Нет';

            responseDiv.style.display = 'block';
        }

        // Check server status on load
        checkServerStatus();
    </script>
</body>
</html>
