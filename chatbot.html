<!-- Chatbot Widget -->
<div id="chatbot-widget" class="chatbot-widget">
    <div class="chatbot-header" onclick="toggleChatbot()">
        <div class="chatbot-avatar">
            <i class="fas fa-robot"></i>
        </div>
        <div class="chatbot-info">
            <div class="chatbot-name">ATC Bot</div>
            <div class="chatbot-status" id="chatbot-status">Оффлайн</div>
        </div>
        <div class="chatbot-toggle">
            <i class="fas fa-chevron-up" id="chatbot-arrow"></i>
        </div>
    </div>

    <div class="chatbot-body" id="chatbot-body">
        <div class="chatbot-messages" id="chatbot-messages">
            <div class="message bot-message">
                <div class="message-avatar">
                    <i class="fas fa-robot"></i>
                </div>
                <div class="message-content">
                    <div class="message-text">
                        Здравствуйте! 👋<br>
                        Я чат-бот Auto Technical Centre.<br>
                        Чем могу помочь?
                    </div>
                    <div class="message-time">только что</div>
                </div>
            </div>
        </div>

        <div class="chatbot-input">
            <div class="input-group">
                <input type="text" id="chatbot-input" placeholder="Напишите сообщение..." onkeypress="handleChatbotKeypress(event)">
                <div class="input-group-append">
                    <button class="btn btn-primary" onclick="sendChatbotMessage()">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
            <div class="chatbot-quick-buttons">
                <button class="btn btn-sm btn-outline-primary" onclick="quickQuestion('техосмотр')">Техосмотр</button>
                <button class="btn btn-sm btn-outline-primary" onclick="quickQuestion('запись')">Запись</button>
                <button class="btn btn-sm btn-outline-primary" onclick="quickQuestion('адрес')">Адрес</button>
                <button class="btn btn-sm btn-outline-primary" onclick="quickQuestion('цены')">Цены</button>
            </div>
        </div>
    </div>
</div>

<!-- Chatbot Styles -->
<style>
.chatbot-widget {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 350px;
    background: white;
    border-radius: 15px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    z-index: 1000;
    overflow: hidden;
    transform: translateY(0);
    transition: all 0.3s ease;
    font-family: 'Inter', sans-serif;
}

.chatbot-widget.minimized {
    transform: translateY(calc(100% - 70px));
}

.chatbot-widget.minimized .chatbot-body {
    display: none;
}

.chatbot-header {
    background: linear-gradient(135deg, #ff7a00 0%, #e66a00 100%);
    color: white;
    padding: 15px;
    display: flex;
    align-items: center;
    cursor: pointer;
    user-select: none;
}

.chatbot-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-right: 12px;
}

.chatbot-avatar i {
    font-size: 18px;
}

.chatbot-info {
    flex: 1;
}

.chatbot-name {
    font-weight: 600;
    font-size: 16px;
}

.chatbot-status {
    font-size: 12px;
    opacity: 0.8;
}

.chatbot-status.online {
    color: #4caf50;
}

.chatbot-toggle {
    margin-left: auto;
}

.chatbot-body {
    max-height: 400px;
    display: flex;
    flex-direction: column;
}

.chatbot-messages {
    flex: 1;
    padding: 15px;
    overflow-y: auto;
    max-height: 300px;
}

.message {
    display: flex;
    margin-bottom: 15px;
    align-items: flex-start;
}

.message-avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-right: 10px;
    flex-shrink: 0;
}

.bot-message .message-avatar {
    background: #ff7a00;
    color: white;
}

.user-message {
    flex-direction: row-reverse;
}

.user-message .message-avatar {
    background: #007bff;
    color: white;
    margin-left: 10px;
    margin-right: 0;
}

.user-message .message-content {
    text-align: right;
}

.message-content {
    flex: 1;
    max-width: calc(100% - 40px);
}

.message-text {
    background: #f8f9fa;
    padding: 10px 12px;
    border-radius: 12px;
    margin-bottom: 5px;
    line-height: 1.4;
}

.bot-message .message-text {
    background: #f8f9fa;
}

.user-message .message-text {
    background: #007bff;
    color: white;
}

.message-time {
    font-size: 11px;
    color: #666;
}

.chatbot-input {
    border-top: 1px solid #e9ecef;
    padding: 15px;
    background: white;
}

.input-group {
    display: flex;
    border: 1px solid #ddd;
    border-radius: 25px;
    overflow: hidden;
}

#chatbot-input {
    flex: 1;
    border: none;
    outline: none;
    padding: 10px 15px;
    font-size: 14px;
}

.btn {
    border: none;
    background: #ff7a00;
    color: white;
    padding: 10px 15px;
    cursor: pointer;
    transition: background 0.2s;
}

.btn:hover {
    background: #e66a00;
}

.btn-outline-primary {
    background: transparent;
    border: 1px solid #007bff;
    color: #007bff;
    margin: 0 2px;
    font-size: 12px;
    padding: 4px 8px;
}

.btn-outline-primary:hover {
    background: #007bff;
    color: white;
}

.chatbot-quick-buttons {
    margin-top: 8px;
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
}

/* Mobile responsiveness */
@media (max-width: 768px) {
    .chatbot-widget {
        width: calc(100vw - 40px);
        right: 20px;
        left: 20px;
        bottom: 20px;
    }

    .chatbot-messages {
        max-height: 250px;
    }
}
</style>

<script>
let chatbotVisible = true;
let ws = null;

// Toggle chatbot visibility
function toggleChatbot() {
    const widget = document.getElementById('chatbot-widget');
    const arrow = document.getElementById('chatbot-arrow');

    chatbotVisible = !chatbotVisible;

    if (chatbotVisible) {
        widget.classList.remove('minimized');
        arrow.classList.remove('fa-chevron-down');
        arrow.classList.add('fa-chevron-up');
    } else {
        widget.classList.add('minimized');
        arrow.classList.remove('fa-chevron-up');
        arrow.classList.add('fa-chevron-down');
    }
}

// Send message to chatbot
function sendChatbotMessage() {
    const input = document.getElementById('chatbot-input');
    const message = input.value.trim();

    if (!message) return;

    // Add user message to chat
    addMessage(message, 'user');

    // Send to server if WebSocket is connected
    if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({
            type: 'chat',
            message: message,
            userId: 'user_' + Date.now()
        }));
    } else {
        // Fallback to local responses
        setTimeout(() => {
            const response = getLocalResponse(message);
            addMessage(response, 'bot');
        }, 1000);
    }

    input.value = '';
}

// Quick question buttons
function quickQuestion(question) {
    document.getElementById('chatbot-input').value = question;
    sendChatbotMessage();
}

// Handle Enter key in input
function handleChatbotKeypress(event) {
    if (event.key === 'Enter') {
        sendChatbotMessage();
    }
}

// Add message to chat
function addMessage(text, sender) {
    const messagesContainer = document.getElementById('chatbot-messages');
    const messageDiv = document.createElement('div');
    messageDiv.className = `message ${sender}-message`;

    const avatar = sender === 'bot' ?
        '<i class="fas fa-robot"></i>' :
        '<i class="fas fa-user"></i>';

    messageDiv.innerHTML = `
        <div class="message-avatar">${avatar}</div>
        <div class="message-content">
            <div class="message-text">${text}</div>
            <div class="message-time">${new Date().toLocaleTimeString('ru-RU', {
                hour: '2-digit',
                minute: '2-digit'
            })}</div>
        </div>
    `;

    messagesContainer.appendChild(messageDiv);
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
}

// Local chatbot responses (fallback)
function getLocalResponse(message) {
    const responses = {
        'привет': 'Здравствуйте! Я помогу с информацией о техосмотре.',
        'здравствуйте': 'Добрый день! Чем могу помочь?',
        'техосмотр': 'Техосмотр в нашем центре занимает всего 17 минут! Работаем с автомобилями всех марок.',
        'запись': 'Записаться можно по телефону +7 700 243 30 10 или через форму на сайте.',
        'адрес': 'Мы находимся по адресу: г. Астана, Қобыз, 36.',
        'время работы': 'Работаем ежедневно с 9:00 до 19:00 без выходных.',
        'цены': 'Стоимость техосмотра от 3500 тенге. Подробности уточняйте по телефону.',
        'документы': 'Нужны: техпаспорт, удостоверение личности, доверенность (если требуется).'
    };

    const lowerMessage = message.toLowerCase();

    for (const [key, response] of Object.entries(responses)) {
        if (lowerMessage.includes(key)) {
            return response;
        }
    }

    return 'Спасибо за вопрос! Для подробной информации позвоните нам по телефону +7 700 243 30 10.';
}

// WebSocket connection for real-time chat
function connectWebSocket() {
    try {
        ws = new WebSocket('ws://localhost:3003');

        ws.onopen = function() {
            document.getElementById('chatbot-status').textContent = 'Онлайн';
            document.getElementById('chatbot-status').className = 'chatbot-status online';
        };

        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);

            if (data.type === 'chat_response') {
                addMessage(data.message, 'bot');
            }
        };

        ws.onclose = function() {
            document.getElementById('chatbot-status').textContent = 'Оффлайн';
            document.getElementById('chatbot-status').className = 'chatbot-status';
        };

        ws.onerror = function() {
            console.log('WebSocket connection failed, using local responses');
        };
    } catch (error) {
        console.log('WebSocket not available, using local responses');
    }
}

// Initialize chatbot
document.addEventListener('DOMContentLoaded', function() {
    // Connect to WebSocket after page load
    setTimeout(connectWebSocket, 2000);
});

// Auto-show chatbot after 30 seconds
setTimeout(() => {
    if (!document.querySelector('.chatbot-widget.minimized')) {
        // Show chatbot hint or auto-open
        console.log('Chatbot is ready for use');
    }
}, 30000);
</script>
